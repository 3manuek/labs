global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels: { component: postgres }

  - job_name: sql_exporter
    static_configs:
      - targets: ['sql_exporter:9399']
        labels: { component: postgres }

  - job_name: pgbouncer
    static_configs:
      - targets: ['pgbouncer_exporter:9127']
        labels: { component: pgbouncer }

  - job_name: proxysql
    metrics_path: /metrics
    static_configs:
      - targets: ['proxysql:6070']
        labels: { component: proxysql }

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # keep only lab containers
      - source_labels: [name]
        regex: 'pst-.*'
        action: keep

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
