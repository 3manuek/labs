; PgBouncer — transaction pooling, settings aligned with docker/proxysql/proxysql.cnf
; Keep POOL_SIZE in .env and default_pool_size / max_db_connections in sync.

[databases]
bench = host=postgres port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
listen_backlog = 4096

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = admin
stats_users = stats

pool_mode = transaction
max_client_conn = 4000
default_pool_size = 20
max_db_connections = 20
min_pool_size = 0
reserve_pool_size = 0
max_prepared_statements = 200

server_idle_timeout = 600
server_lifetime = 3600
query_wait_timeout = 120
client_login_timeout = 60

; required by pgbouncer_exporter (lib/pq sends extra_float_digits)
ignore_startup_parameters = extra_float_digits

; keep logging out of the hot path
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 10
verbose = 0
