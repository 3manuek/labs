# PostgreSQL 18 settings for the pooler benchmark.
# Goal: keep Postgres out of the way so the pooler is the measured bottleneck.
listen_addresses = '*'
max_connections = 700                 # 'direct' target opens up to 512 client backends
shared_buffers = 1GB                  # whole dataset fits in memory
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB

# WAL / durability: fsync stays on, but commits don't wait for flush
synchronous_commit = off
wal_compression = lz4
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Observability
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
track_activity_query_size = 2048
log_min_duration_statement = -1
log_connections = off
log_disconnections = off

# Autovacuum stays on (realistic), but tuned so bench tables don't bloat within a cell
autovacuum_naptime = 10s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05
